[package]
name = "fux-bach"
description = "Fugues in the style of Bach on a given subject: rules with a chord as their input, a search for the free voices, and the runs of the feasibility study"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fux_bach"
path = "src/lib.rs"

[features]
default = ["tools"]
# The programs: the command line, runs side by side, and the Fux checker for part T2 of the study.
# Without it the library has no threads and compiles to WebAssembly (crates/fux-bach-web).
tools = ["dep:clap", "dep:rayon", "dep:fux-core", "dep:roxmltree"]

[[bin]]
name = "bach-probe"
path = "src/main.rs"
required-features = ["tools"]

[[bin]]
name = "fux-fuge"
path = "src/fuge.rs"
required-features = ["tools"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
fux-core = { workspace = true, optional = true }
midly.workspace = true
rayon = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
serde_json.workspace = true

[lints]
workspace = true
