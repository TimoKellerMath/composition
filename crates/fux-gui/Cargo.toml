[package]
name = "fux-gui"
description = "Graphical interface for generating and checking species counterpoint after Fux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fux_gui"
path = "src/lib.rs"

[[bin]]
name = "fux-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe = { version = "0.37", features = ["persistence"] }
fux-cli.workspace = true
fux-core = { workspace = true, features = ["parallel"] }
fux-export.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rustysynth = "1.3"
serde.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
