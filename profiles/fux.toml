# Regelprofil "fux": Standardwerte nach Fux' eigenen Beispielen.
# Begründung und Quellen jeder Regel stehen in docs/regeln.md.
#
# Stufen: "aus", "V" (verboten), "P1" … "P4" (Kosten 1, 2, 4, 8) oder eine Zahl als Kosten.
# Ein eigenes Profil nennt nur, was es ändert, und wird mit --profile geladen.
# Einzelne Werte ändert --rule ID=STUFE (alle Stufen der Regel) oder --rule ID.PARAMETER=WERT.

name = "fux"

# 1. Cantus firmus

[CF-START]
level = "V"

[CF-END]
level = "V"

[CF-PENULT]
level = "V"

[CF-LENGTH]
level = "V"
warning = "P1"
min = 6
max = 20
warn_min = 8
warn_max = 16

[CF-DIATONIC]
level = "V"

[CF-RANGE]
level = "V"
soft = "P3"
narrow = "P3"
max_steps = 9        # Dezime
soft_max_steps = 7   # Oktave
min_steps = 4        # Quinte; Korpus: kein Cantus enger

[CF-AMBITUS]
level = "P2"
tolerance = 1
either = true        # authentischer oder plagaler Ambitus

[CF-REPEAT]
level = "V"

[CF-STEPS]
level = "P1"
max_leap_percent = 50

[CF-LEAP-COST]
third = "aus"
fourth = "P1"
fifth = "P2"
sixth = "P3"
octave = "P2"

[CF-CLIMAX]
level = "V"
at_ends = "V"
outside_middle = "P2"
middle_from = 30     # Korpus: Höhepunkte bei 42–64 % der Länge
middle_to = 75

[CF-VARIETY]
oscillation = "P1"
frequent = "P1"
max_count = 3

[CF-MOTIF]
level = "P2"
literal = 4
transposed = 5

[CF-SOLVABLE]
level = "V"          # nur beim Erzeugen: 1. Gattung darüber und darunter muss gehen

# 2. Melodik

[MEL-TRITONE]
level = "V"

[MEL-AUG-DIM]
