g1_two_voices = "V"
g2_wide = "P3"
default = "aus"

[MEL-MIN6-DOWN]
level = "aus"
free = "V"           # freier Satz; Palestrina: 7×

[MEL-LEAP-COST]
third = "P1"
fourth = "P1"
fifth = "P2"
sixth = "P2"
octave = "P1"
free_third = "aus"        # freier Satz, Palestrina: 11–13 % aller Tonschritte
free_fourth = "P1"        # Oberstimmen 4–5 %
free_fifth = "P2"         # Oberstimmen 2–4 %
free_sixth = "P3"         # 0,1–0,2 %
free_octave = "P2"        # Oberstimmen 0,4–1 %
free_bass_fourth = "aus"  # Bass 9,7 %
free_bass_fifth = "aus"   # Bass 10 %
free_bass_octave = "P1"   # Bass 1,3 %

[MEL-LEAP-RECOVERY]
level = "P2"         # vorläufig
min_steps = 4        # ab der Quinte

[MEL-CONSEC-LEAPS]
level = "P3"         # vorläufig
beyond_octave = "V"
larger_above = "P2"  # Korpus: 10 von 151 Dreiklangsbrechungen
free = "P3"          # freier Satz: zwei Sprünge in dieselbe Richtung 0,5 % der Dreitonfolgen
free_turn = "P1"     # freier Satz: zwei Sprünge mit Wende 4,3 %

[MEL-TRITONE-OUTLINE]
level = "P2"         # vorläufig

[MEL-REPEAT]
g1 = "P1"
g2_g4 = "V"
g5 = "P3"              # Korpus: Fig. 156
four_voices = "P3"     # Korpus: Fig. 173, 181
anticipation = "P2"    # Korpus: 3 von 53 Gelegenheiten (Fig. 86a, 87a, 88b)
free = "P1"            # freier Satz: vorläufig
free_black = "P1"      # freier Satz, nach einer schwarzen Note außer der Vorausnahme, mit und ohne
                       # Text: danach beginnt keine neue Silbe (TXT-AFTER-BLACK), die Wiederholung
                       # bleibt im Melisma. Palestrina: Viertel auf Viertel 1,6 je 1000 Töne (1,4 %
                       # der Viertelschritte); mit Text gemessen 83 → 2 (vierstimmig, Kyrie bis
                       # Gloria). Wie free, damit Sätze ohne Text gleich bleiben; vorläufig
free_run = "P1"        # freier Satz, dritter und weiterer gleicher Ton in Folge, mit und ohne Text:
                       # mindestens diese Stufe; der Text rechtfertigt eine Wiederholung, kein
                       # Rezitieren. Palestrina: 2,4 je 100 Stimmtakte; mit Text gemessen 5,0
                       # (vierstimmig, Kyrie bis Gloria), fünfstimmig 9, mit P1 0,1 und 0,5. Ohne
                       # Text ändert P1 nichts (free und free_black sind P1); vorläufig
free_texted = "aus"    # freier Satz, Stimme mit Text, nach einer weißen Note (statt free):
                       # Palestrinas Tonwiederholungen tragen neue Silben (Jeppesen S. 94);
                       # TXT-REPEATED-PITCH regelt sie. Gemessen (vierstimmig, Kyrie bis Gloria):
                       # 17 % der weißen Noten wiederholen den Ton davor (vor free_black 16 %, mit
                       # free_run P1 13 %, mit P1 statt aus 0,5–1,2 %), bei Palestrina 9–11 %

[MEL-VARIETY]
g1_within_three_measures = "P1"   # vorläufig
g3_two_beats = "P1"
g4_arsis = "P3"
g5_two_beats = "P1"               # Korpus: 28 von 153
free_two_beats = "P1"             # freier Satz: vorläufig

[MEL-MOTIF]
g1 = "P3"
g2 = "P3"            # Korpus: Fig. 39–41
g3 = "aus"           # Korpus: häufig
g4 = "P3"            # Korpus: zweistimmig nie, dreistimmig Fig. 149
g5 = "aus"           # Korpus: häufig
free = "aus"         # freier Satz: vorläufig
notes = 4

[MEL-CLIMAX]
level = "P1"         # vorläufig

